services:
  lh-sobes:
    build: .
    container_name: lh-sobes
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      INTERVIEW_STORAGE_MODE: ${INTERVIEW_STORAGE_MODE:-json}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SELF_EMPLOYMENT_BUTTON_URL: ${SELF_EMPLOYMENT_BUTTON_URL:-}
      PUZZLEBOT_API_TOKEN: ${PUZZLEBOT_API_TOKEN:-}
      PUZZLEBOT_PRIVATE_CHAT_ID: ${PUZZLEBOT_PRIVATE_CHAT_ID:-}
      PUZZLEBOT_INTERVIEW_CATEGORY_ID: ${PUZZLEBOT_INTERVIEW_CATEGORY_ID:-}
      PUZZLEBOT_API_TIMEOUT_MS: ${PUZZLEBOT_API_TIMEOUT_MS:-10000}
      PUZZLEBOT_API_URL: ${PUZZLEBOT_API_URL:-https://api.puzzlebot.top/}
    ports:
      - "127.0.0.1:3700:3000"
    volumes:
      - ./data:/app/data
    networks:
      - default
      - loft-hall-internship-unified

networks:
  loft-hall-internship-unified:
    external: true
    name: loft-hall-internship-unified_default
